x-rails-env: &rails_env
  HOST: "0.0.0.0"
  BUNDLE_PATH: /bundle

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ./.bashrc:/root/.bashrc:ro,cached
      - ..:/workspace:cached
      - bundle_cache:/bundle
    ports:
      - ${PORT:-3000}:3000
    command: sleep infinity
    environment:
      <<: *rails_env

  selenium:
    image: selenium/standalone-chromium:latest
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2gb
    restart: unless-stopped

volumes:
  bundle_cache:
